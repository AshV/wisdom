name: Deploy Wisdom to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Website (wiz-site)
        uses: actions/checkout@v4
        with:
          path: wiz-site

      - name: Checkout Theme (wiz-theme)
        uses: actions/checkout@v4
        with:
          repository: AshV/wiz-theme
          path: wiz-theme

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wiz-site/package-lock.json

      - name: Install theme dependencies
        working-directory: wiz-theme
        run: npm ci

      - name: Install site dependencies
        working-directory: wiz-site
        run: npm ci

      - name: Cache Astro & Vite incremental build artifacts
        uses: actions/cache@v4
        with:
          path: |
            wiz-site/node_modules/.astro
            wiz-site/node_modules/.vite
          key: ${{ runner.os }}-wisdom-build-${{ hashFiles('wiz-site/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-wisdom-build-${{ hashFiles('wiz-site/package-lock.json') }}-
            ${{ runner.os }}-wisdom-build-

      - name: Build
        working-directory: wiz-site
        run: npm run build
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY || vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID || vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.PUBLIC_FIREBASE_DATABASE_URL || vars.PUBLIC_FIREBASE_DATABASE_URL }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID || vars.PUBLIC_FIREBASE_APP_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wiz-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
